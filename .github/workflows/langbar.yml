name: langbar

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  langbar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerar a barra de linguagens
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gen-langbar.py --out assets/langbar.svg

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- assets/langbar.svg; then
            echo "barra inalterada; nada a commitar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/langbar.svg
          git commit -m "chore: atualiza a barra de linguagens"
          git push
